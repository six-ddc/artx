<!doctype html>
<html lang="en" data-artx-dist="artx-dist-placeholder">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>artx</title>
    <style>
      body { font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
             margin: 0; display: grid; place-items: center; min-height: 100vh;
             background: #0b0d10; color: #c9d1d9; }
      .box { max-width: 40rem; padding: 2rem; }
      code { background: #161b22; padding: .15em .4em; border-radius: 4px; }
      h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>artx — frontend not built yet</h1>
      <p>
        This binary embeds the placeholder page
        (<code>artx-dist-placeholder</code>). Run <code>make web</code> or
        <code>make build</code> to build <code>web/</code>, then rebuild the
        binary to get the real interface.
      </p>
      <p>The HTTP API is unaffected — <code>/api/health</code> works.</p>
    </div>
  </body>
</html>
