version: 2

project_name: artx

# The binary embeds the built frontend (internal/server/dist). The repo only
# carries a placeholder index.html so that `go build ./...` works without a
# frontend toolchain, which means a release build MUST run `make web` first —
# otherwise the published binaries would serve the placeholder page.
# This also implies the release runner needs Node + pnpm, not just Go.
before:
  hooks:
    - go mod download
    - make web

builds:
  - id: artx
    main: ./cmd/artx
    binary: artx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/six-ddc/artx/internal/version.Version={{ .Version }}
      - -X github.com/six-ddc/artx/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/six-ddc/artx/internal/version.Date={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: artx
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99

release:
  draft: false
  prerelease: auto

